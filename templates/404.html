<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>404 — Page Not Found | DESI CLOUD</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="error-page">

<header class="navbar">

    <div class="container nav-content">

        <a href="/" class="brand">

            <span class="brand-icon">☁</span>

            <span>DESI <strong>CLOUD</strong></span>

        </a>

    </div>

</header>


<main class="error-main">

    <div class="container">

        <div class="error-card">

            <div class="error-icon">
                ☁
            </div>


            <h1>
                404
            </h1>


            <h2>
                Page Not Found
            </h2>


            <p>
                The page or file you are looking for may have
                been removed, disabled, or the link may be invalid.
            </p>


            <div class="error-actions">

                <a href="/"
                   class="btn btn-primary btn-large">

                    Back to Home

                </a>


                <a href="https://t.me/{{ bot_username }}"
                   target="_blank"
                   rel="noopener"
                   class="btn btn-secondary btn-large">

                    Open Telegram ↗

                </a>

            </div>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="container footer-content">

        <a href="/" class="brand">
            <span class="brand-icon">☁</span>
            <span>DESI <strong>CLOUD</strong></span>
        </a>

        <p>
            © {{ current_year|default(2026) }} DESI CLOUD.
        </p>

    </div>

</footer>


<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
