<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMR Cloud</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    text-align: center;
    padding: 30px;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 5px;
}

.logo span {
    color: #7c9cff;
}

.subtitle {
    color: #9299aa;
    letter-spacing: 2px;
    margin-top: 15px;
}

.card {
    margin-top: 35px;
    padding: 35px;
    border: 1px solid #28334b;
    border-radius: 20px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(15px);
}

.badge {
    color: #7c9cff;
    font-size: 13px;
    letter-spacing: 3px;
}

footer {
    margin-top: 30px;
    color: #667085;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">AMR <span>CLOUD</span></div>

    <div class="subtitle">
        PRIVATE FILE HOSTING PLATFORM
    </div>

    <div class="card">
        <div class="badge">SECURE FILE ACCESS</div>
        <h2>Your files, one place.</h2>
        <p>Powered by AMR Cloud.</p>
    </div>

    <footer>
        © 2026 AMR CLOUD
    </footer>

</div>

</body>
</html>
